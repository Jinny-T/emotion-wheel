<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天，你的心情是？</title>
<style>
  html,body{height:100%;margin:0;background:#F3E7D3;}
  #wrap{position:fixed;inset:0;}
  iframe{width:100%;height:100%;border:0;display:block;}
  #fallback{position:fixed;left:0;right:0;bottom:16px;text-align:center;
            font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;font-size:13px;}
  #fallback a{color:#8C7660;}
</style>
</head>
<body>
<div id="wrap"><iframe id="f" title="情緒輪"></iframe></div>
<div id="fallback">畫面沒出來嗎？<a id="go" href="#" target="_blank" rel="noopener">改用新分頁開啟</a></div>

<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbwJ1vFHHmoBKRBQ4daiUWoZz_A4IZ63m52KPbpRNwwU50onLxlN_QTvcQZMkuW_jMQ/exec';

  var p = new URLSearchParams(location.search);
  var wheel = (p.get('wheel') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64);
  var mode  = (p.get('mode') === 'inward' || p.get('mode') === 'outward') ? p.get('mode') : '';

  var target = EXEC;
  if (wheel) target += '?wheel=' + encodeURIComponent(wheel);
  if (mode)  target += (target.indexOf('?') === -1 ? '?' : '&') + 'mode=' + encodeURIComponent(mode);

  document.getElementById('f').src = target;
  document.getElementById('go').href = target;
</script>
</body>
</html>
