<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>API 測試</title>
<style>body{font-family:system-ui,sans-serif;padding:20px;font-size:14px;}
pre{white-space:pre-wrap;word-break:break-all;background:#f5f5f5;padding:12px;border-radius:8px;}</style>
</head>
<body>
<h2 id="s">測試中…</h2>
<pre id="out"></pre>
<script>
var EXEC='https://script.google.com/macros/s/AKfycbwJ1vFHHmoBKRBQ4daiUWoZz_A4IZ63m52KPbpRNwwU50onLxlN_QTvcQZMkuW_jMQ/exec';
fetch(EXEC+'?api=published')
  .then(function(r){ return r.text(); })
  .then(function(t){
    var d=JSON.parse(t);
    document.getElementById('s').textContent='✅ 成功！拿到 '+(d.wheels?d.wheels.length:0)+' 個情緒輪';
    document.getElementById('out').textContent=(d.wheels||[]).map(function(w){return w.id+' — '+w.name;}).join('\n');
  })
  .catch(function(e){
    document.getElementById('s').textContent='❌ 失敗：'+e.message;
    document.getElementById('out').textContent=e.stack||'';
  });
</script>
</body>
</html>
